[theme]
base = "dark"
font = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
headingFont = "'DM Serif Display':https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["42px", "32px", "25px", "20px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "medium"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#b32639"
backgroundColor = "#f7f6f0"
secondaryBackgroundColor = "#eeeee7"
textColor = "#19201b"
linkColor = "#9b1f30"
borderColor = "#cbd2ca"
dataframeBorderColor = "#cbd2ca"
dataframeHeaderBackgroundColor = "#e6e7df"
greenColor = "#087a52"
greenBackgroundColor = "#e2f4e9"
greenTextColor = "#07583c"
redColor = "#c73545"
redBackgroundColor = "#f8e4e5"
redTextColor = "#8b1725"
orangeColor = "#a65f00"
orangeBackgroundColor = "#fff0d8"
orangeTextColor = "#704000"
blueColor = "#1666a5"
blueBackgroundColor = "#e3eff8"
blueTextColor = "#124a77"
grayColor = "#667168"

[theme.light.sidebar]
backgroundColor = "#e9eae3"
secondaryBackgroundColor = "#ddded6"
textColor = "#19201b"
borderColor = "#cbd2ca"
primaryColor = "#b32639"

[theme.dark]
primaryColor = "#c73545"
backgroundColor = "#0b0f0e"
secondaryBackgroundColor = "#141a18"
textColor = "#f4f0e7"
linkColor = "#ff747c"
borderColor = "#303b36"
dataframeBorderColor = "#303b36"
dataframeHeaderBackgroundColor = "#171f1c"
greenColor = "#48d597"
greenBackgroundColor = "#10271d"
greenTextColor = "#7ff0b5"
redColor = "#ff6871"
redBackgroundColor = "#32171a"
redTextColor = "#ff9a9f"
orangeColor = "#ffb547"
orangeBackgroundColor = "#30230f"
orangeTextColor = "#ffd28a"
blueColor = "#7ab7ff"
blueBackgroundColor = "#16283a"
blueTextColor = "#acd3ff"
grayColor = "#aab5ad"

[theme.dark.sidebar]
backgroundColor = "#070a09"
secondaryBackgroundColor = "#121815"
textColor = "#f4f0e7"
borderColor = "#303b36"
primaryColor = "#c73545"

[client]
toolbarMode = "viewer"
pageIconEmoji = "🧭"
