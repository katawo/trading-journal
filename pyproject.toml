[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-journal"
version = "0.1.0"
description = "Local-first trading journal with read-only MT5 imports"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "pydantic>=2.13,<3",
  "plotly>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.61,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
