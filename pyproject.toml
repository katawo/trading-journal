[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-compass"
version = "0.1.12"
description = "Trade Compass: a local-first trade review app with read-only MT5 imports"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "pandas>=2.2,<4",
  "pydantic>=2.13,<3",
  "plotly>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.61,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1"]
desktop = [
  "pyinstaller>=6.10,<7",
  "pywebview>=5,<7",
  # Pin pythonnet (pulled transitively by pywebview on Windows for the native
  # window). Unpinned, a CI Python change resolved a pythonnet whose bundled
  # Python.Runtime.dll no longer matched clr_loader, so the frozen app failed
  # with "Failed to resolve Python.Runtime.Loader.Initialize". 3.0.5 is the
  # mature 3.0.x line with Python 3.12 support. Windows-only so the Linux
  # desktop build never tries to install it.
  "pythonnet==3.0.5; sys_platform == 'win32'",
]
multiuser = [
  "streamlit-authenticator>=0.4,<0.5",
  "pyyaml>=6,<7",
]
ingestion = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = "-m 'not desktop'"
markers = [
  "desktop: tests for the optional desktop launcher and frozen desktop workflow",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
