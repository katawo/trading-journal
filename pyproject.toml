[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-compass"
version = "0.1.13"
description = "A post-trade assessment app focused on trader mental health and three-pillar performance reviews"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "pandas>=2.2,<4",
  "pydantic>=2.13,<3",
  "plotly>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "streamlit==1.61.1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "playwright>=1.62,<2"]
multiuser = [
  "streamlit-authenticator>=0.4,<0.5",
  "pyyaml>=6,<7",
]
ingestion = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = "-m 'not web and not browser'"
markers = [
  "bdd: scenarios organized explicitly as Given/When/Then behavior",
  "web: maintained Streamlit interaction regression scenarios",
  "browser: tests that execute client-side behavior in a real browser",
]
testpaths = ["tests"]
norecursedirs = ["legacy"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
