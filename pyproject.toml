[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-compass"
version = "0.1.4"
description = "Trade Compass: a local-first trade review app with read-only MT5 imports"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "pandas>=2.2,<4",
  "pydantic>=2.13,<3",
  "plotly>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.61,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
desktop = [
  "pyinstaller>=6.10,<7",
  "pywebview>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
