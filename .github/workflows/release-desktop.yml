name: Release desktop bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            executable: .\dist\TradeCompass\TradeCompass.exe
          - name: Linux
            runner: ubuntu-latest
            executable: ./dist/TradeCompass/TradeCompass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              package_version = tomllib.load(file)["project"]["version"]
          expected_tag = f"v{package_version}"
          if os.environ["GITHUB_REF_NAME"] != expected_tag:
              raise SystemExit(
                  f"Release tag must be {expected_tag}, got {os.environ['GITHUB_REF_NAME']}"
              )
      - name: Install and verify
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"
          python -m pytest -q
      - name: Build portable bundle
        run: python scripts/build_desktop.py
      - name: Smoke-test portable bundle
        run: python scripts/smoke_desktop_bundle.py ${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --repo "${GITHUB_REPOSITORY}"
          fi
