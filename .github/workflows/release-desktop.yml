name: Release desktop bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
          - name: Linux
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and verify
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"
          python -m pytest -q
      - name: Build portable bundle
        run: python scripts/build_desktop.py
      - name: Smoke-test portable bundle (Linux)
        if: runner.os == 'Linux'
        env:
          TRADING_JOURNAL_DESKTOP_DATA_DIR: ${{ runner.temp }}/trading-journal-desktop-smoke
        run: ./dist/TradingJournal/TradingJournal --self-check
      - name: Smoke-test recovery UI (Linux)
        if: runner.os == 'Linux'
        run: python scripts/smoke_desktop_recovery.py ./dist/TradingJournal/TradingJournal
      - name: Smoke-test portable bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TRADING_JOURNAL_DESKTOP_DATA_DIR: ${{ runner.temp }}\trading-journal-desktop-smoke
        run: .\dist\TradingJournal\TradingJournal.exe --self-check
      - name: Smoke-test recovery UI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/smoke_desktop_recovery.py .\dist\TradingJournal\TradingJournal.exe
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --repo "${GITHUB_REPOSITORY}"
          fi
